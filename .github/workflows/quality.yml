name: Quality

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # app/layout.tsx의 metadataBase가 빌드 시점에 getApiBaseUrl()을 평가하므로
    # build가 도는 job에는 APP_ORIGIN이 있어야 한다. E2E의 baseURL과 같은 값을 쓴다.
    env:
      APP_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      # 설정 실수를 build 전에 막는다. 값은 출력하지 않고 변수 이름과 사유만 남긴다.
      - name: Validate environment
        run: node scripts/validate-env.mjs
      - name: Run production build
        run: pnpm build
      # size-limit은 .next 산출물을 읽으므로 반드시 build 뒤에 둔다.
      # 앞에 두면 "can't find files at .next/static/chunks/**/*.js"로 실패한다.
      - name: Check bundle budget
        id: budget
        run: pnpm exec size-limit --json > size-limit-result.json
      # 초과로 앞 step이 실패해도 리포트는 남아야 한다. 조건을 "성공했을 때"가 아니라
      # "측정이 실행됐을 때"로 두는 이유다(2단계 아티팩트 업로드에서 겪은 것과 같은 구조).
      - name: Report bundle budget
        if: ${{ !cancelled() && steps.budget.conclusion != 'skipped' }}
        run: node scripts/report-bundle-budget.mjs size-limit-result.json
